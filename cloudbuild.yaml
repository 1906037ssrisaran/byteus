steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-api:$BUILD_ID
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-api:$BUILD_ID

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-api:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=shieldiq-api@$PROJECT_ID.iam.gserviceaccount.com
      - --port=8080
      - --set-env-vars=SHIELDIQ_ENV=production,SHIELDIQ_DEMO_MODE=false,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},FIREBASE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=(default),BIGQUERY_DATASET=shieldiq,GCS_EVIDENCE_BUCKET=${_EVIDENCE_BUCKET},API_CORS_ORIGINS=${_WEB_ORIGIN},GOOGLE_GENAI_USE_VERTEXAI=true,GEMINI_MODEL=${_GEMINI_MODEL}

  - id: resolve-api-origin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe ${_API_SERVICE} --region=${_REGION} --format='value(status.url)' > /workspace/api-origin.txt

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        API_ORIGIN="$(cat /workspace/api-origin.txt)"
        docker build -f apps/web/Dockerfile \
          --build-arg NEXT_PUBLIC_API_BASE_URL="$${API_ORIGIN}/api/v1" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${_FIREBASE_WEB_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${_FIREBASE_WEB_APP_ID}" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-web:$BUILD_ID .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-web:$BUILD_ID

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=shieldiq-web@$PROJECT_ID.iam.gserviceaccount.com
      - --port=8080
      - --set-env-vars=NODE_ENV=production

  - id: apply-web-origin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        WEB_ORIGIN="$(gcloud run services describe ${_WEB_SERVICE} --region=${_REGION} --format='value(status.url)')"
        API_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-api:$BUILD_ID"
        gcloud run services update ${_API_SERVICE} --region=${_REGION} \
          --image="$${API_IMAGE}" \
          --update-env-vars="API_CORS_ORIGINS=$${WEB_ORIGIN}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shieldiq-web:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
